name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew test bootJar
      - name: Verify version and prepare checksum
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          jar="daily-randomizer-${version}.jar"
          test -f "build/libs/$jar"
          cd build/libs
          sha256sum "$jar" > "$jar.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "build/libs/daily-randomizer-${version}.jar" \
            "build/libs/daily-randomizer-${version}.jar.sha256" \
            --title "Daily Randomizer ${version}" --generate-notes
